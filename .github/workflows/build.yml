name: Build check

# Deployment happens on the Tencent Cloud server itself
# (blog-sync.timer -> git pull + hexo generate). This workflow only verifies
# that the site still builds, so a broken commit is visible in Actions.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npx hexo generate
