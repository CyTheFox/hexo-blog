name: Build and Deploy Hexo Blog

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Pull sticker library from server
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 59.110.213.166 >> ~/.ssh/known_hosts 2>/dev/null || true
          mkdir -p source/album/emotion/stickers
          rsync -az --exclude '*.bak' \
            dsbot@59.110.213.166:/home/dsbot/qq-workspace/stickers/files/ \
            source/album/emotion/stickers/ || echo "sticker sync skipped"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install

      - name: Generate Static Site
        run: |
          npx hexo clean
          npx hexo generate

      - name: Deploy to Server via SSH
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "public/"
          REMOTE_HOST: "59.110.213.166"
          REMOTE_USER: "dsbot"
          TARGET: "/home/dsbot/blog/public/"
          EXCLUDE: "/.git/, /node_modules/"
