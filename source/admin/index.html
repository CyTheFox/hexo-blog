<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>博客管理后台 - Decap CMS</title>
  
  <!-- Vditor CSS -->
  <link rel="stylesheet" href="/blog/vditor/dist/index.css" />
  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="/blog/vditor/dist/js/katex/katex.min.css" />

  <style>
    /* minimal: only style the Vditor surface if it is ever mounted */
    .vditor { border-radius: 8px; }

    /* dsh:v2 layout guards (survive Decap class leakage onto .vditor) */
    .vditor { display: flex !important; flex-direction: column !important; }
    .vditor > .vditor-content { width: 100% !important; }
    .vditor > .vditor-content > .vditor-ir { width: 100% !important; min-width: 0 !important; }

    /* Image click indicator in editor */
    .vditor-ir img {
      cursor: pointer;
      transition: outline 0.15s ease;
    }
    .vditor-ir img:hover {
      outline: 2px solid #0969da;
    }
  </style>
</head>
<body>
  <script>
    // 兼容 HTTP 环境（非 HTTPS 环境下浏览器禁用 crypto.randomUUID 的补丁）
    if (!window.crypto || !window.crypto.randomUUID) {
      window.crypto = window.crypto || {};
      window.crypto.randomUUID = function() {
        return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, function(c) {
          return (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4)).toString(16);
        });
      };
    }
  </script>

  <!-- Vditor Core JS -->
  <script src="/blog/vditor/dist/index.min.js"></script>

  <!-- KaTeX Core & Auto-render -->
  <script src="https://cdn.cbd.int/katex@0.16.9/dist/katex.min.js"></script>

  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // 注册 KaTeX 样式表到 Decap CMS 预览区
    CMS.registerPreviewStyle("/blog/vditor/js/katex/katex.min.css");
    CMS.registerPreviewStyle("/blog/vditor/index.css");

    // 获取当前 Decap CMS 登录会话中的 GitHub Token
    function getGithubToken() {
      try {
        var u = JSON.parse(localStorage.getItem('decap-cms-user') || localStorage.getItem('netlify-cms-user') || '{}');
        return u.token || null;
      } catch(e) {
        return null;
      }
    }

    // 生成规范且唯一的图片文件名
    function formatFileName(originalName) {
      var ext = '.png';
      if (originalName && originalName.lastIndexOf('.') !== -1) {
        ext = originalName.substring(originalName.lastIndexOf('.')).toLowerCase();
      }
      var now = new Date();
      var pad = function(n) { return (n < 10 ? '0' : '') + n; };
      var dateStr = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + '_' + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
      var rand = Math.random().toString(36).substring(2, 6);
      return dateStr + '_' + rand + ext;
    }

    // 将 File 对象读取为 Base64 纯数据字符串
    function fileToBase64(file) {
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function() {
          var res = reader.result;
          var base64 = res.indexOf(',') !== -1 ? res.split(',')[1] : res;
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // 初始化图片悬浮操作条（对齐、文字包围、缩放尺寸）
    function initImageFloatingBar(vditor, container, onContentChange) {
      var bar = document.getElementById('vditor-img-floating-bar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'vditor-img-floating-bar';
        document.body.appendChild(bar);
      }

      bar.style.cssText = [
        'position: absolute',
        'display: none',
        'z-index: 999999',
        'background: #1e2227',
        'color: #e6edf3',
        'padding: 6px 10px',
        'border-radius: 8px',
        'box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1)',
        'font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        'font-size: 12px',
        'user-select: none',
        'align-items: center',
        'gap: 8px',
        'white-space: nowrap',
        'transition: opacity 0.12s ease'
      ].join(';');

      var currentTargetImg = null;
      var currentSettings = {
        align: 'default',
        width: '100%',
        rounded: true
      };

      bar.innerHTML = `
        <div style="display: flex; align-items: center; gap: 4px;">
          <span style="font-size: 11px; opacity: 0.6; margin-right: 2px;">对齐:</span>
          <button type="button" class="img-bar-btn" data-align="left" title="居左文字环绕">⬅ 左环绕</button>
          <button type="button" class="img-bar-btn" data-align="center" title="居中对齐">⏹ 居中</button>
          <button type="button" class="img-bar-btn" data-align="right" title="居右文字环绕">右环绕 ➡</button>
          <button type="button" class="img-bar-btn" data-align="default" title="恢复默认独占行">默认</button>
        </div>

        <div style="width: 1px; height: 16px; background: rgba(255, 255, 255, 0.15);"></div>

        <div style="display: flex; align-items: center; gap: 4px;">
          <span style="font-size: 11px; opacity: 0.6; margin-right: 2px;">尺寸:</span>
          <button type="button" class="img-bar-btn" data-size="25%" title="宽度 25%">25%</button>
          <button type="button" class="img-bar-btn" data-size="50%" title="宽度 50%">50%</button>
          <button type="button" class="img-bar-btn" data-size="75%" title="宽度 75%">75%</button>
          <button type="button" class="img-bar-btn" data-size="100%" title="宽度 100%">100%</button>
          <input type="range" id="img-bar-range" min="15" max="100" step="5" value="100" style="width: 55px; height: 4px; accent-color: #0969da; cursor: pointer; margin-left: 4px;" title="滑动微调尺寸" />
          <span id="img-bar-range-val" style="font-size: 11px; min-width: 32px; text-align: right; color: #58a6ff;">100%</span>
        </div>

        <div style="width: 1px; height: 16px; background: rgba(255, 255, 255, 0.15);"></div>

        <div style="display: flex; align-items: center; gap: 4px;">
          <button type="button" class="img-bar-btn" data-action="toggle-rounded" title="切换圆角美化">圆角</button>
          <button type="button" class="img-bar-btn" data-action="delete" style="color: #ff7b72;" title="删除图片">🗑</button>
          <button type="button" class="img-bar-btn" data-action="close" style="opacity: 0.5;" title="关闭">✕</button>
        </div>
      `;

      if (!document.getElementById('vditor-img-bar-style')) {
        var styleEl = document.createElement('style');
        styleEl.id = 'vditor-img-bar-style';
        styleEl.textContent = `
          .img-bar-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #e6edf3;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s ease;
            line-height: 1.2;
          }
          .img-bar-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.25);
          }
          .img-bar-btn.active {
            background: #0969da !important;
            color: #ffffff !important;
            border-color: #1f6feb !important;
            font-weight: 600;
          }
        `;
        document.head.appendChild(styleEl);
      }

      var rangeInput = bar.querySelector('#img-bar-range');
      var rangeVal = bar.querySelector('#img-bar-range-val');

      function updateBarPosition() {
        if (!currentTargetImg || !currentTargetImg.isConnected) {
          hideBar();
          return;
        }
        var rect = currentTargetImg.getBoundingClientRect();
        var barW = bar.offsetWidth || 440;
        var barH = bar.offsetHeight || 38;

        var left = rect.left + (rect.width / 2) - (barW / 2);
        var top = rect.top - barH - 10;

        if (left < 10) left = 10;
        if (left + barW > window.innerWidth - 10) left = window.innerWidth - barW - 10;
        if (top < 10) top = rect.bottom + 10;

        bar.style.left = (left + window.scrollX) + 'px';
        bar.style.top = (top + window.scrollY) + 'px';
        bar.style.display = 'flex';
      }

      function hideBar() {
        bar.style.display = 'none';
        currentTargetImg = null;
      }

      function parseImgSettings(img) {
        var rawSrc = img.getAttribute('src') || '';
        var parent = img.parentElement;
        var style = img.getAttribute('style') || '';
        var widthAttr = img.getAttribute('width') || '';

        var align = 'default';
        if (style.indexOf('float: left') !== -1 || style.indexOf('float:left') !== -1) {
          align = 'left';
        } else if (style.indexOf('float: right') !== -1 || style.indexOf('float:right') !== -1) {
          align = 'right';
        } else if (parent && (parent.getAttribute('align') === 'center' || parent.style.textAlign === 'center' || style.indexOf('margin: 0 auto') !== -1)) {
          align = 'center';
        }

        var width = '100%';
        var wMatch = style.match(/width:\s*([^;]+)/i);
        if (wMatch) {
          width = wMatch[1].trim();
        } else if (widthAttr) {
          width = widthAttr.endsWith('%') || widthAttr.endsWith('px') ? widthAttr : (widthAttr + 'px');
        }

        var rounded = style.indexOf('border-radius') !== -1 || img.style.borderRadius !== '';

        return {
          src: rawSrc,
          alt: img.getAttribute('alt') || '',
          align: align,
          width: width,
          rounded: rounded
        };
      }

      function highlightActiveButtons() {
        bar.querySelectorAll('.img-bar-btn[data-align]').forEach(function(btn) {
          if (btn.getAttribute('data-align') === currentSettings.align) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        bar.querySelectorAll('.img-bar-btn[data-size]').forEach(function(btn) {
          if (btn.getAttribute('data-size') === currentSettings.width) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        var rBtn = bar.querySelector('.img-bar-btn[data-action="toggle-rounded"]');
        if (rBtn) {
          if (currentSettings.rounded) {
            rBtn.classList.add('active');
          } else {
            rBtn.classList.remove('active');
          }
        }

        var num = parseInt(currentSettings.width) || 100;
        rangeInput.value = num;
        rangeVal.textContent = currentSettings.width;
      }

      function applyImgUpdate(newSettings) {
        if (!currentTargetImg) return;
        var info = parseImgSettings(currentTargetImg);
        var src = info.src;
        var alt = info.alt;

        var align = newSettings.align !== undefined ? newSettings.align : currentSettings.align;
        var width = newSettings.width !== undefined ? newSettings.width : currentSettings.width;
        var rounded = newSettings.rounded !== undefined ? newSettings.rounded : currentSettings.rounded;

        currentSettings = { align: align, width: width, rounded: rounded };

        var radiusCss = rounded ? ' border-radius: 8px;' : '';
        var replacement = '';

        if (align === 'center') {
          replacement = '<div align="center"><img src="' + src + '" alt="' + alt + '" style="width: ' + width + ';' + radiusCss + '" /></div>';
        } else if (align === 'left') {
          replacement = '<img src="' + src + '" alt="' + alt + '" style="float: left; margin: 0 16px 12px 0; width: ' + width + ';' + radiusCss + '" />';
        } else if (align === 'right') {
          replacement = '<img src="' + src + '" alt="' + alt + '" style="float: right; margin: 0 0 12px 16px; width: ' + width + ';' + radiusCss + '" />';
        } else {
          if (width === '100%' && !rounded) {
            replacement = '![' + alt + '](' + src + ')';
          } else {
            replacement = '<img src="' + src + '" alt="' + alt + '" style="width: ' + width + ';' + radiusCss + '" />';
          }
        }

        var md = vditor.getValue();
        var escapedSrc = src.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

        var regex = new RegExp(
          '(<div[^>]*align=["\']?center["\']?[^>]*>\\s*<img[^>]*src=["\']?' + escapedSrc + '["\']?[^>]*>\\s*<\\/div>)|' +
          '(<img[^>]*src=["\']?' + escapedSrc + '["\']?[^>]*>)|' +
          '(!\\[[^\\]]*\\]\\(' + escapedSrc + '(?:\\s+["\'][^"\']*["\'])?\\))',
          'i'
        );

        var match = md.match(regex);
        if (match) {
          var newMd = md.substring(0, match.index) + replacement + md.substring(match.index + match[0].length);
          vditor.setValue(newMd);
          onContentChange(newMd);
          if (typeof vditor.tip === 'function') {
            vditor.tip('已更新图片布局', 1000);
          }
        }

        highlightActiveButtons();

        setTimeout(function() {
          var imgs = container.querySelectorAll('img');
          for (var j = 0; j < imgs.length; j++) {
            if (imgs[j].getAttribute('src') === src) {
              currentTargetImg = imgs[j];
              updateBarPosition();
              break;
            }
          }
        }, 150);
      }

      // 绑定按钮点击事件
      bar.addEventListener('click', function(e) {
        var btn = e.target.closest('.img-bar-btn');
        if (!btn) return;
        e.stopPropagation();

        var align = btn.getAttribute('data-align');
        if (align) {
          applyImgUpdate({ align: align });
          return;
        }

        var size = btn.getAttribute('data-size');
        if (size) {
          applyImgUpdate({ width: size });
          return;
        }

        var action = btn.getAttribute('data-action');
        if (action === 'toggle-rounded') {
          applyImgUpdate({ rounded: !currentSettings.rounded });
        } else if (action === 'delete') {
          if (!currentTargetImg) return;
          var info = parseImgSettings(currentTargetImg);
          var src = info.src;
          var md = vditor.getValue();
          var escapedSrc = src.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          var regex = new RegExp(
            '(<div[^>]*align=["\']?center["\']?[^>]*>\\s*<img[^>]*src=["\']?' + escapedSrc + '["\']?[^>]*>\\s*<\\/div>)|' +
            '(<img[^>]*src=["\']?' + escapedSrc + '["\']?[^>]*>)|' +
            '(!\\[[^\\]]*\\]\\(' + escapedSrc + '(?:\\s+["\'][^"\']*["\'])?\\))',
            'i'
          );
          var match = md.match(regex);
          if (match) {
            var newMd = md.substring(0, match.index) + md.substring(match.index + match[0].length);
            vditor.setValue(newMd);
            onContentChange(newMd);
            hideBar();
            if (typeof vditor.tip === 'function') {
              vditor.tip('图片已删除', 1200);
            }
          }
        } else if (action === 'close') {
          hideBar();
        }
      });

      rangeInput.addEventListener('input', function() {
        var val = rangeInput.value + '%';
        rangeVal.textContent = val;
        if (currentTargetImg) {
          currentTargetImg.style.width = val;
        }
      });

      rangeInput.addEventListener('change', function() {
        var val = rangeInput.value + '%';
        applyImgUpdate({ width: val });
      });

      container.addEventListener('click', function(e) {
        var target = e.target;
        if (target && target.tagName === 'IMG') {
          currentTargetImg = target;
          currentSettings = parseImgSettings(target);
          highlightActiveButtons();
          updateBarPosition();
          e.stopPropagation();
        } else if (!bar.contains(e.target)) {
          hideBar();
        }
      });

      document.addEventListener('click', function(e) {
        if (!container.contains(e.target) && !bar.contains(e.target)) {
          hideBar();
        }
      });

      window.addEventListener('resize', updateBarPosition);
      window.addEventListener('scroll', updateBarPosition, true);
    }

    // 自定义 Vditor 控制组件
    var VditorControl = window.createClass({
      componentDidMount: function() {
        var self = this;
        var initialValue = this.props.value || '';
        this.isInternalChange = false;

        this.vditor = new Vditor(this.container, {
          cdn: '/blog/vditor',
          value: initialValue,
          mode: 'ir', // 即时渲染模式 (Typora-like 所见即所得体验)
          height: 650,
          minHeight: 450,
          placeholder: '请输入文章正文内容 (支持 Markdown、KaTeX 公式、代码高亮、表格、Mermaid 流程图，支持剪贴板直接粘贴图片，点击图片可呼出悬浮排版条)...',
          counter: {
            enable: true
          },
          cache: {
            enable: false // 由 Decap CMS 全权管理文章状态与版本，避免本地缓存冲突
          },
          toolbarConfig: {
            pin: true
          },
          toolbar: [
            'emoji',
            'headings',
            'bold',
            'italic',
            'strike',
            'link',
            '|',
            'list',
            'ordered-list',
            'check',
            'outdent',
            'indent',
            '|',
            'quote',
            'line',
            'code',
            'inline-code',
            'insert-before',
            'insert-after',
            '|',
            'upload', // 图片上传按钮（支持本地选择）
            'table',
            'edit-mode',
            'fullscreen',
            {
              name: 'more',
              toolbar: [
                'both',
                'code-theme',
                'content-theme',
                'export',
                'outline',
                'preview',
                'devtools'
              ]
            }
          ],
          upload: {
            accept: 'image/*,.png,.jpg,.jpeg,.gif,.webp,.svg',
            multiple: true,
            max: 15 * 1024 * 1024,
            handler: async function(files) {
              if (!files || files.length === 0) return null;
              if (self.vditor && typeof self.vditor.tip === 'function') {
                self.vditor.tip('正在上传图片，请稍候...', 0);
              }

              var token = getGithubToken();

              for (var i = 0; i < files.length; i++) {
                var file = files[i];
                var cleanFileName = formatFileName(file.name || 'image.png');
                var base64Data = await fileToBase64(file);
                var isUploaded = false;

                // 1. 同步上传到本地服务器 /api/upload（确保页面即时预览秒出，且服务器备份完整）
                try {
                  var localRes = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename: cleanFileName, content: base64Data })
                  });
                  if (localRes.ok) {
                    isUploaded = true;
                  }
                } catch(localErr) {
                  console.warn('Local upload failed, fallback to GitHub:', localErr);
                }

                // 2. 如果已通过 GitHub 登录获取到 Token，直接调用 GitHub Contents API 提交到仓库 source/img/
                if (token) {
                  try {
                    var ghUrl = 'https://api.github.com/repos/CyTheFox/hexo-blog/contents/source/img/' + cleanFileName;
                    var ghRes = await fetch(ghUrl, {
                      method: 'PUT',
                      headers: {
                        'Authorization': 'token ' + token,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                      },
                      body: JSON.stringify({
                        message: 'Upload image ' + cleanFileName + ' via CMS Vditor',
                        content: base64Data,
                        branch: 'main'
                      })
                    });
                    if (ghRes.ok) {
                      isUploaded = true;
                    }
                  } catch(ghErr) {
                    console.warn('GitHub API upload failed:', ghErr);
                  }
                }

                if (isUploaded) {
                  var mdImage = '\n![' + (file.name || cleanFileName) + '](/img/' + cleanFileName + ')\n';
                  self.vditor.insertValue(mdImage);
                  if (self.vditor && typeof self.vditor.tip === 'function') {
                    self.vditor.tip('图片上传成功！已插入标准链接', 2000);
                  }
                } else {
                  if (self.vditor && typeof self.vditor.tip === 'function') {
                    self.vditor.tip('图片上传失败，请检查网络连接', 4000);
                  }
                }
              }
              return null;
            }
          },
          input: function(val) {
            self.isInternalChange = true;
            if (self.props.onChange) {
              self.props.onChange(val);
            }
          },
          after: function() {
            self.isLoaded = true;
            initImageFloatingBar(self.vditor, self.container, function(newVal) {
              self.isInternalChange = true;
              if (self.props.onChange) {
                self.props.onChange(newVal);
              }
            });
          }
        });
      },

      componentDidUpdate: function(prevProps) {
        if (this.vditor && this.isLoaded && this.props.value !== prevProps.value) {
          if (this.isInternalChange) {
            this.isInternalChange = false;
          } else {
            // 外部更新数据（如异步加载文章或重置时）
            var currentVal = this.vditor.getValue();
            if (this.props.value !== currentVal) {
              this.vditor.setValue(this.props.value || '');
            }
          }
        }
      },

      componentWillUnmount: function() {
        if (this.vditor) {
          try {
            this.vditor.destroy();
          } catch(e) {}
          this.vditor = null;
        }
      },

      render: function() {
        var self = this;
        return window.h('div',
          { className: this.props.classNameWrapper || '' },
          window.h('div', {
            style: {
              width: '100%',
              height: '650px',
              position: 'relative',
              marginBottom: '16px'
            },
            ref: function(el) {
              self.container = el;
            }
          })
        );
      }
    });

    // 自定义 Vditor 预览组件（右侧预览区）
    var VditorPreview = window.createClass({
      componentDidMount: function() {
        this.renderPreview();
      },
      componentDidUpdate: function() {
        this.renderPreview();
      },
      renderPreview: function() {
        if (!this.container || !window.Vditor) return;
        Vditor.preview(this.container, this.props.value || '', {
          cdn: '/blog/vditor',
          mode: 'light',
          markdown: {
            toc: true,
            mark: true,
            footnotes: true
          }
        });
      },
      render: function() {
        var self = this;
        return window.h('div', {
          style: {
            padding: '20px',
            backgroundColor: '#ffffff'
          },
          ref: function(el) {
            self.container = el;
          }
        });
      }
    });

    // 注册 Widget 到 Decap CMS
    CMS.registerWidget('vditor', VditorControl, VditorPreview);

    // 监听右侧实时预览 iframe，处理额外公式渲染
    (function watchPreview() {
      function renderMathInDoc(doc) {
        if (!doc || !doc.body || !window.renderMathInElement) return;
        try {
          window.renderMathInElement(doc.body, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false },
              { left: "\\(", right: "\\)", display: false },
              { left: "\\[", right: "\\]", display: true }
            ],
            throwOnError: false
          });
        } catch(e) {}
      }

      var observer = new MutationObserver(function() {
        var iframes = document.querySelectorAll("iframe");
        iframes.forEach(function(iframe) {
          try {
            var doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
            if (doc && doc.body && !doc.__katexAttached) {
              doc.__katexAttached = true;
              if (!doc.querySelector('link[href*="katex"]')) {
                var link = doc.createElement("link");
                link.rel = "stylesheet";
                link.href = "/blog/vditor/js/katex/katex.min.css";
                doc.head.appendChild(link);
              }
              var timer = null;
              var debouncedRender = function() {
                clearTimeout(timer);
                timer = setTimeout(function() {
                  renderMathInDoc(doc);
                }, 100);
              };
              new MutationObserver(debouncedRender).observe(doc.body, {
                childList: true,
                subtree: true,
                characterData: true
              });
              renderMathInDoc(doc);
            }
          } catch(err) {}
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>

  <!-- DSH_LAYOUT_DEBUG: only active with ?debug=1 -->
  <script>
    if (location.search.indexOf('debug=1') !== -1) {
      var dumpTimer = setInterval(function () {
        var v = document.querySelector('.vditor');
        if (!v) return;
        clearInterval(dumpTimer);
        function box(el) {
          if (!el) return null;
          var r = el.getBoundingClientRect(), cs = getComputedStyle(el);
          return {
            cls: (el.className || el.tagName).toString().slice(0, 34),
            x: Math.round(r.x), w: Math.round(r.width), h: Math.round(r.height),
            display: cs.display, flex: cs.flex, padL: cs.paddingLeft
          };
        }
        function chain(el, n) {
          var out = [];
          for (var i = 0; i < n && el; i++) { out.push(box(el)); el = el.parentElement; }
          return out;
        }
        var lines = [];
        lines.push('viewport=' + window.innerWidth + 'x' + window.innerHeight);
        lines.push('--- .vditor children ---');
        ['.vditor-toolbar', '.vditor-content', '.vditor-ir', '.vditor-preview', '.vditor-reset', '.vditor-counter']
          .forEach(function (sel) {
            var b = box(document.querySelector(sel));
            lines.push(sel + ' ' + (b ? JSON.stringify(b) : 'MISSING'));
          });
        lines.push('--- parent chain ---');
        chain(v, 5).forEach(function (b, i) { lines.push(i + ': ' + JSON.stringify(b)); });
        lines.push('--- vditor classes ---');
        lines.push(v.className);
        var pre = document.getElementById('dsh-layout-debug');
        if (!pre) {
          pre = document.createElement('pre');
          pre.id = 'dsh-layout-debug';
          pre.style.cssText = 'position:fixed;left:8px;top:8px;z-index:2147483647;background:#fff;border:2px solid #f00;padding:8px;font:11px/1.4 monospace;max-width:620px;white-space:pre-wrap;box-shadow:0 4px 16px rgba(0,0,0,.3)';
          document.body.appendChild(pre);
        }
        pre.textContent = lines.join('\n');
      }, 800);
    }
  </script>
