<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>博客管理后台 - Decap CMS</title>
  
  <!-- Vditor CSS -->
  <link rel="stylesheet" href="/blog/vditor/dist/index.css" />
  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="/blog/vditor/dist/js/katex/katex.min.css" />

  <style>
    /* minimal: only style the Vditor surface if it is ever mounted */
    .vditor { border-radius: 8px; }

    /* dsh:v2 layout guards (survive Decap class leakage onto .vditor) */
    .vditor { display: flex !important; flex-direction: column !important; }
    .vditor > .vditor-content { width: 100% !important; }
    .vditor > .vditor-content > .vditor-ir { width: 100% !important; min-width: 0 !important; }
  </style>
</head>
<body>
  <script>
    // 兼容 HTTP 环境（非 HTTPS 环境下浏览器禁用 crypto.randomUUID 的补丁）
    if (!window.crypto || !window.crypto.randomUUID) {
      window.crypto = window.crypto || {};
      window.crypto.randomUUID = function() {
        return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, function(c) {
          return (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4)).toString(16);
        });
      };
    }
  </script>

  <!-- Vditor Core JS -->
  <script src="/blog/vditor/dist/index.min.js"></script>

  <!-- KaTeX Core & Auto-render -->
  <script src="https://cdn.cbd.int/katex@0.16.9/dist/katex.min.js"></script>

  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // 注册 KaTeX 样式表到 Decap CMS 预览区
    CMS.registerPreviewStyle("/blog/vditor/js/katex/katex.min.css");
    CMS.registerPreviewStyle("/blog/vditor/index.css");

    // 获取当前 Decap CMS 登录会话中的 GitHub Token
    function getGithubToken() {
      try {
        var u = JSON.parse(localStorage.getItem('decap-cms-user') || localStorage.getItem('netlify-cms-user') || '{}');
        return u.token || null;
      } catch(e) {
        return null;
      }
    }

    // 生成规范且唯一的图片文件名
    function formatFileName(originalName) {
      var ext = '.png';
      if (originalName && originalName.lastIndexOf('.') !== -1) {
        ext = originalName.substring(originalName.lastIndexOf('.')).toLowerCase();
      }
      var now = new Date();
      var pad = function(n) { return (n < 10 ? '0' : '') + n; };
      var dateStr = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + '_' + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
      var rand = Math.random().toString(36).substring(2, 6);
      return dateStr + '_' + rand + ext;
    }

    // 将 File 对象读取为 Base64 纯数据字符串
    function fileToBase64(file) {
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function() {
          var res = reader.result;
          var base64 = res.indexOf(',') !== -1 ? res.split(',')[1] : res;
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // 自定义 Vditor 控制组件
    var VditorControl = window.createClass({
      componentDidMount: function() {
        var self = this;
        var initialValue = this.props.value || '';
        this.isInternalChange = false;

        this.vditor = new Vditor(this.container, {
          cdn: '/blog/vditor',
          value: initialValue,
          mode: 'ir', // 即时渲染模式 (Typora-like 所见即所得体验)
          height: 650,
          minHeight: 450,
          placeholder: '请输入文章正文内容 (支持 Markdown、KaTeX 公式、代码高亮、表格、Mermaid 流程图，支持剪贴板直接粘贴图片)...',
          counter: {
            enable: true
          },
          cache: {
            enable: false // 由 Decap CMS 全权管理文章状态与版本，避免本地缓存冲突
          },
          toolbarConfig: {
            pin: true
          },
          toolbar: [
            'emoji',
            'headings',
            'bold',
            'italic',
            'strike',
            'link',
            '|',
            'list',
            'ordered-list',
            'check',
            'outdent',
            'indent',
            '|',
            'quote',
            'line',
            'code',
            'inline-code',
            'insert-before',
            'insert-after',
            '|',
            'upload', // 图片上传按钮（支持本地选择）
            'table',
            'edit-mode',
            'fullscreen',
            {
              name: 'more',
              toolbar: [
                'both',
                'code-theme',
                'content-theme',
                'export',
                'outline',
                'preview',
                'devtools'
              ]
            }
          ],
          upload: {
            accept: 'image/*,.png,.jpg,.jpeg,.gif,.webp,.svg',
            multiple: true,
            max: 15 * 1024 * 1024,
            handler: async function(files) {
              if (!files || files.length === 0) return null;
              if (self.vditor && typeof self.vditor.tip === 'function') {
                self.vditor.tip('正在上传图片，请稍候...', 0);
              }

              var token = getGithubToken();

              for (var i = 0; i < files.length; i++) {
                var file = files[i];
                var cleanFileName = formatFileName(file.name || 'image.png');
                var base64Data = await fileToBase64(file);
                var isUploaded = false;

                // 1. 同步上传到本地服务器 /api/upload（确保页面即时预览秒出，且服务器备份完整）
                try {
                  var localRes = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename: cleanFileName, content: base64Data })
                  });
                  if (localRes.ok) {
                    isUploaded = true;
                  }
                } catch(localErr) {
                  console.warn('Local upload failed, fallback to GitHub:', localErr);
                }

                // 2. 如果已通过 GitHub 登录获取到 Token，直接调用 GitHub Contents API 提交到仓库 source/img/
                if (token) {
                  try {
                    var ghUrl = 'https://api.github.com/repos/CyTheFox/hexo-blog/contents/source/img/' + cleanFileName;
                    var ghRes = await fetch(ghUrl, {
                      method: 'PUT',
                      headers: {
                        'Authorization': 'token ' + token,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                      },
                      body: JSON.stringify({
                        message: 'Upload image ' + cleanFileName + ' via CMS Vditor',
                        content: base64Data,
                        branch: 'main'
                      })
                    });
                    if (ghRes.ok) {
                      isUploaded = true;
                    }
                  } catch(ghErr) {
                    console.warn('GitHub API upload failed:', ghErr);
                  }
                }

                if (isUploaded) {
                  var mdImage = '\n![' + (file.name || cleanFileName) + '](/img/' + cleanFileName + ')\n';
                  self.vditor.insertValue(mdImage);
                  if (self.vditor && typeof self.vditor.tip === 'function') {
                    self.vditor.tip('图片上传成功！已插入标准链接', 2000);
                  }
                } else {
                  if (self.vditor && typeof self.vditor.tip === 'function') {
                    self.vditor.tip('图片上传失败，请检查网络连接', 4000);
                  }
                }
              }
              return null;
            }
          },
          input: function(val) {
            self.isInternalChange = true;
            if (self.props.onChange) {
              self.props.onChange(val);
            }
          },
          after: function() {
            self.isLoaded = true;
          }
        });
      },

      componentDidUpdate: function(prevProps) {
        if (this.vditor && this.isLoaded && this.props.value !== prevProps.value) {
          if (this.isInternalChange) {
            this.isInternalChange = false;
          } else {
            // 外部更新数据（如异步加载文章或重置时）
            var currentVal = this.vditor.getValue();
            if (this.props.value !== currentVal) {
              this.vditor.setValue(this.props.value || '');
            }
          }
        }
      },

      componentWillUnmount: function() {
        if (this.vditor) {
          try {
            this.vditor.destroy();
          } catch(e) {}
          this.vditor = null;
        }
      },

      render: function() {
        var self = this;
        return window.h('div',
          { className: this.props.classNameWrapper || '' },
          window.h('div', {
            style: {
              width: '100%',
              height: '650px',
              position: 'relative',
              marginBottom: '16px'
            },
            ref: function(el) {
              self.container = el;
            }
          })
        );
      }
    });

    // 自定义 Vditor 预览组件（右侧预览区）
    var VditorPreview = window.createClass({
      componentDidMount: function() {
        this.renderPreview();
      },
      componentDidUpdate: function() {
        this.renderPreview();
      },
      renderPreview: function() {
        if (!this.container || !window.Vditor) return;
        Vditor.preview(this.container, this.props.value || '', {
          cdn: '/blog/vditor',
          mode: 'light',
          markdown: {
            toc: true,
            mark: true,
            footnotes: true
          }
        });
      },
      render: function() {
        var self = this;
        return window.h('div', {
          style: {
            padding: '20px',
            backgroundColor: '#ffffff'
          },
          ref: function(el) {
            self.container = el;
          }
        });
      }
    });

    // 注册 Widget 到 Decap CMS
    CMS.registerWidget('vditor', VditorControl, VditorPreview);

    // 监听右侧实时预览 iframe，处理额外公式渲染
    (function watchPreview() {
      function renderMathInDoc(doc) {
        if (!doc || !doc.body || !window.renderMathInElement) return;
        try {
          window.renderMathInElement(doc.body, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false },
              { left: "\\(", right: "\\)", display: false },
              { left: "\\[", right: "\\]", display: true }
            ],
            throwOnError: false
          });
        } catch(e) {}
      }

      var observer = new MutationObserver(function() {
        var iframes = document.querySelectorAll("iframe");
        iframes.forEach(function(iframe) {
          try {
            var doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
            if (doc && doc.body && !doc.__katexAttached) {
              doc.__katexAttached = true;
              if (!doc.querySelector('link[href*="katex"]')) {
                var link = doc.createElement("link");
                link.rel = "stylesheet";
                link.href = "/blog/vditor/js/katex/katex.min.css";
                doc.head.appendChild(link);
              }
              var timer = null;
              var debouncedRender = function() {
                clearTimeout(timer);
                timer = setTimeout(function() {
                  renderMathInDoc(doc);
                }, 100);
              };
              new MutationObserver(debouncedRender).observe(doc.body, {
                childList: true,
                subtree: true,
                characterData: true
              });
              renderMathInDoc(doc);
            }
          } catch(err) {}
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>

  <!-- DSH_LAYOUT_DEBUG: only active with ?debug=1 -->
  <script>
    if (location.search.indexOf('debug=1') !== -1) {
      var dumpTimer = setInterval(function () {
        var v = document.querySelector('.vditor');
        if (!v) return;
        clearInterval(dumpTimer);
        function box(el) {
          if (!el) return null;
          var r = el.getBoundingClientRect(), cs = getComputedStyle(el);
          return {
            cls: (el.className || el.tagName).toString().slice(0, 34),
            x: Math.round(r.x), w: Math.round(r.width), h: Math.round(r.height),
            display: cs.display, flex: cs.flex, padL: cs.paddingLeft
          };
        }
        function chain(el, n) {
          var out = [];
          for (var i = 0; i < n && el; i++) { out.push(box(el)); el = el.parentElement; }
          return out;
        }
        var lines = [];
        lines.push('viewport=' + window.innerWidth + 'x' + window.innerHeight);
        lines.push('--- .vditor children ---');
        ['.vditor-toolbar', '.vditor-content', '.vditor-ir', '.vditor-preview', '.vditor-reset', '.vditor-counter']
          .forEach(function (sel) {
            var b = box(document.querySelector(sel));
            lines.push(sel + ' ' + (b ? JSON.stringify(b) : 'MISSING'));
          });
        lines.push('--- parent chain ---');
        chain(v, 5).forEach(function (b, i) { lines.push(i + ': ' + JSON.stringify(b)); });
        lines.push('--- vditor classes ---');
        lines.push(v.className);
        var pre = document.getElementById('dsh-layout-debug');
        if (!pre) {
          pre = document.createElement('pre');
          pre.id = 'dsh-layout-debug';
          pre.style.cssText = 'position:fixed;left:8px;top:8px;z-index:2147483647;background:#fff;border:2px solid #f00;padding:8px;font:11px/1.4 monospace;max-width:620px;white-space:pre-wrap;box-shadow:0 4px 16px rgba(0,0,0,.3)';
          document.body.appendChild(pre);
        }
        pre.textContent = lines.join('\n');
      }, 800);
    }
  </script>
</body>
</html>
