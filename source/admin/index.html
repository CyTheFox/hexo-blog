<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>博客管理后台 - Decap CMS</title>
  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.cbd.int/katex@0.16.9/dist/katex.min.css" />
</head>
<body>
  <script>
    // 兼容 HTTP 环境（非 HTTPS 环境下浏览器禁用 crypto.randomUUID 的补丁）
    if (!window.crypto || !window.crypto.randomUUID) {
      window.crypto = window.crypto || {};
      window.crypto.randomUUID = function() {
        return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, function(c) {
          return (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4)).toString(16);
        });
      };
    }
  </script>

  <!-- KaTeX core & auto-render -->
  <script src="https://cdn.cbd.int/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.cbd.int/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // 1. 注册 KaTeX 样式表到 Decap CMS 预览区
    CMS.registerPreviewStyle("https://cdn.cbd.int/katex@0.16.9/dist/katex.min.css");

    // 2. 注册可视化编辑器组件：数学公式 (KaTeX)
    CMS.registerEditorComponent({
      id: "katex",
      label: "数学公式 (KaTeX)",
      fields: [
        { name: "formula", label: "LaTeX 公式代码", widget: "text" },
        { name: "block", label: "独占一行 (Block)", widget: "boolean", default: true }
      ],
      pattern: /(?:^\$\$\s*([\s\S]*?)\s*\$\$|\$([^\$\n]+)\$)/m,
      fromBlock: function(match) {
        return {
          formula: match[1] || match[2] || "",
          block: Boolean(match[1])
        };
      },
      toBlock: function(obj) {
        if (obj.block) {
          return "$$\n" + (obj.formula || "").trim() + "\n$$";
        }
        return "$" + (obj.formula || "").trim() + "$";
      },
      toPreview: function(obj) {
        try {
          return window.katex.renderToString(obj.formula || "", {
            displayMode: obj.block,
            throwOnError: false
          });
        } catch (e) {
          return '<span style="color:red">KaTeX Error: ' + e.message + '</span>';
        }
      }
    });

    // 3. 注册可视化编辑器组件：正文音乐卡片 (Meting)
    CMS.registerEditorComponent({
      id: "meting_music",
      label: "音乐播放卡片 (Meting)",
      fields: [
        { name: "id", label: "歌曲或歌单ID / 链接", widget: "string", hint: "例如 186016 或 https://music.163.com/song?id=186016" },
        { name: "server", label: "音乐平台", widget: "select", options: ["netease", "tencent", "kugou"], default: "netease" },
        { name: "type", label: "类型", widget: "select", options: ["song", "playlist"], default: "song" }
      ],
      pattern: /^<meting-js\s+id="([^"]+)"\s+server="([^"]+)"\s+type="([^"]+)"[^>]*><\/meting-js>$/m,
      fromBlock: function(match) {
        return {
          id: match[1],
          server: match[2],
          type: match[3]
        };
      },
      toBlock: function(obj) {
        var songId = obj.id || "";
        var m = songId.match(/id=(\d+)/);
        if (m) songId = m[1];
        return '<meting-js id="' + songId + '" server="' + (obj.server || 'netease') + '" type="' + (obj.type || 'song') + '" mutex="true" preload="none" theme="var(--anzhiyu-main)"></meting-js>';
      },
      toPreview: function(obj) {
        return '<div style="padding:10px 14px;background:#f6f8fa;border:1px solid #49b1f5;border-radius:8px;display:flex;align-items:center;gap:10px;"><span style="font-size:20px;">🎵</span><span><strong>音乐卡片:</strong> [' + (obj.server || 'netease') + '] ' + (obj.type === 'playlist' ? '歌单' : '单曲') + ' (ID: ' + (obj.id || '') + ')</span></div>';
      }
    });

    // 4. 监听右侧实时预览 iframe，当输入 $...$ 或 $$...$$ 时实时渲染 KaTeX
    (function watchPreview() {
      function renderMathInDoc(doc) {
        if (!doc || !doc.body || !window.renderMathInElement) return;
        try {
          window.renderMathInElement(doc.body, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false },
              { left: "\\(", right: "\\)", display: false },
              { left: "\\[", right: "\\]", display: true }
            ],
            throwOnError: false
          });
        } catch(e) {}
      }

      var observer = new MutationObserver(function() {
        var iframes = document.querySelectorAll("iframe");
        iframes.forEach(function(iframe) {
          try {
            var doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
            if (doc && doc.body && !doc.__katexAttached) {
              doc.__katexAttached = true;
              if (!doc.querySelector('link[href*="katex"]')) {
                var link = doc.createElement("link");
                link.rel = "stylesheet";
                link.href = "https://cdn.cbd.int/katex@0.16.9/dist/katex.min.css";
                doc.head.appendChild(link);
              }
              var timer = null;
              var debouncedRender = function() {
                clearTimeout(timer);
                timer = setTimeout(function() {
                  renderMathInDoc(doc);
                }, 100);
              };
              new MutationObserver(debouncedRender).observe(doc.body, {
                childList: true,
                subtree: true,
                characterData: true
              });
              renderMathInDoc(doc);
            }
          } catch(err) {}
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
